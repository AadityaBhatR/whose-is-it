appId: com.aadityabhat.whoseisit
productName: Whose Is It
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: WhoseIsIt-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: WhoseIsIt-${version}-${arch}.${ext}
  # No paid Apple certificate: build is ad-hoc signed. See README for first-launch steps.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
publish: null
